name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo python3-cairo python3-pil gir1.2-gtk-3.0 gir1.2-wnck-3.0 gir1.2-dbusmenu-glib-0.4 gir1.2-xapp-1.0 shellcheck desktop-file-utils
      - name: Validate source and run regression tests
        run: PATH=/usr/bin:/bin ./tools/check.sh
      - name: Build Debian test package
        run: /usr/bin/python3 tools/build_deb.py
      - uses: actions/upload-artifact@v4
        with:
          name: pear-desktop-deb
          path: |
            dist/*.deb
            dist/*.deb.sha256
