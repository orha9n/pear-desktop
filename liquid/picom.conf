# Liquid — picom ayarı (liquid compositor picom ile etkinleşir; geri: liquid compositor xfwm)
# Gerçek cam: yalnız WM_WINDOW_ROLE'ü "liquid-glass" olan Liquid pencerelerinin (Control Center,
# Spotlight, Uygulamalar) arkası bulanıklaşır. Pencereler şekillerini (yuvarlak köşe) X shape ile verir,
# bulanıklık ve gölge o şekli izler.

backend = "glx";
vsync = true;
use-damage = true;
glx-no-stencil = true;
unredir-if-possible = false;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
fading = false;
# macOS 26: her pencerenin 4 köşesi yuvarlak. MacTahoe xfwm4 teması üst köşeleri ~12 px yuvarlıyor ama
# alt köşeler ve kenarlıksız uygulamalar (Claude, VS Code, Electron) köşeliydi → hepsi 12 px.
corner-radius = 12;
rounded-corners-exclude = [
  "name ^= 'Liquid' || name ^= 'Pear'",                               # çubuk, dock, kartlar şekillerini kendisi veriyor
  "_GTK_FRAME_EXTENTS@:c",                          # GTK CSD: köşeleri ve gölgesi kendinde
  "class_g = 'Xfce4-notifyd'",                      # bildirim kartı köşesini CSS'le çiziyor (18 px)
  "class_g = 'Xfdesktop'",
  "window_type = 'desktop'",
  "window_type = 'dock'",
  "window_type = 'dnd'",
  "window_type = 'tooltip'",
  "_NET_WM_STATE@[*]:32a = '_NET_WM_STATE_MAXIMIZED_HORZ' && _NET_WM_STATE@[*]:32a = '_NET_WM_STATE_MAXIMIZED_VERT'",
  "_NET_WM_STATE@[*]:32a = '_NET_WM_STATE_FULLSCREEN'"
];

# xfwm4'ün çerçeve gölgelerinin yerine (onlar compositor kapanınca gider)
shadow = true;
shadow-radius = 22;
shadow-opacity = 0.30;
shadow-offset-x = -22;
shadow-offset-y = -14;
shadow-exclude = [
  "(name ^= 'Liquid' || name ^= 'Pear') && ! role = 'liquid-glass'",   # çubuk, dock, widget'lar gölgesini kendisi çizer
  "_GTK_FRAME_EXTENTS@:c",                          # GTK CSD pencereleri/menüleri kendi gölgesini çizer
  "class_g = 'Xfdesktop'",
  "class_g = 'Xfce4-notifyd'",                      # dikdörtgen gölge yuvarlak kartın köşelerinden taşıyordu
  "window_type = 'desktop'",
  "window_type = 'dock'",
  "window_type = 'dnd'",
  "_NET_WM_STATE@[*]:32a = '_NET_WM_STATE_MAXIMIZED_HORZ' && _NET_WM_STATE@[*]:32a = '_NET_WM_STATE_MAXIMIZED_VERT'",
  "_NET_WM_STATE@[*]:32a = '_NET_WM_STATE_FULLSCREEN'"
];

blur: {
  method = "dual_kawase";
  strength = 6;
};
blur-background-frame = false;
blur-background-fixed = false;
blur-background-exclude = [
  "! role = 'liquid-glass'"
];

wintypes: {
  tooltip = { shadow = true; full-shadow = false; focus = true; };
  dock = { shadow = false; };
  dnd = { shadow = false; };
};
